name: Test FoodLens

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foodlens-tests
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test national scoring and module compatibility
        run: npm test
      - name: Check all published JavaScript modules
        run: |
          node --check app.mjs
          node --check scores.mjs
          node --check regional.mjs
          node --check sw.js
          node -e "import('./scores.mjs?v=8').then(m => { for (const name of ['calculateNutriScore','calculateHSR','calculateUKTraffic','calculateSingaporeGrade']) if (typeof m[name] !== 'function') throw Error(name + ' export missing'); })"
