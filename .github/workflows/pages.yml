name: Test and publish FoodLens

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: foodlens-pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test national scoring and module compatibility
        run: npm test
      - name: Check all published JavaScript modules
        run: |
          node --check app.mjs
          node --check scores.mjs
          node --check regional.mjs
          node --check sw.js
          node -e "import('./scores.mjs?v=7').then(m => { for (const name of ['calculateNutriScore','calculateHSR','calculateUKTraffic','calculateSingaporeGrade']) if (typeof m[name] !== 'function') throw Error(name + ' export missing'); })"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble public site
        run: |
          mkdir -p dist/icons
          cp index.html app.mjs scores.mjs regional.mjs styles.css sw.js manifest.webmanifest .nojekyll dist/
          cp icons/* dist/icons/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
